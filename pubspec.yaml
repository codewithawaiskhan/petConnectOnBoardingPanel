name: petconnectportal
description: "PetAccess Portal is a centralized Flutter Web-based management platform designed to seamlessly onboard, verify, and manage veterinarians, service providers, and diagnostic labs for the PetAccess ecosystem."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  jwt_decoder: ^2.0.1
  get_it: ^8.2.0
  provider: ^6.1.5+1
  go_router: ^14.8.1
  http: ^1.5.0
  http_parser: ^4.1.2
  html: ^0.15.4
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.1
  cherry_toast: ^1.13.0
  carousel_slider: ^5.1.1
  flutter_spinkit: ^5.2.2
  gradient_borders: ^1.0.2
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.5
  dropdown_button2: ^2.3.9
  shimmer: ^3.0.0
  pin_code_fields: ^8.0.1
  url_launcher: ^6.2.3
  cached_network_image: ^3.4.1
  file_picker: ^8.1.2
  image_picker: ^1.2.0
  image: ^4.5.4
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/fonts/
    - assets/animations/

  fonts:
    - family: Aeonik
      fonts:
        - asset: assets/fonts/aeonik/Aeonik-Regular.ttf
          weight: 400
        - asset: assets/fonts/aeonik/Aeonik Pro Medium.ttf
          weight: 500
        - asset: assets/fonts/aeonik/Aeonik-Bold.ttf
          weight: 700
